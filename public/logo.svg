<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- SDLC Deterministic Circuit Gradient -->
    <linearGradient id="sdlc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- AiDLC Neural Synapse Gradient -->
    <linearGradient id="aidlc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Center Compound AI Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="url(#aidlc-grad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Left: Deterministic SDLC Code Bracket & Circuit Path -->
  <!-- Upper Bracket -->
  <path d="M 46 32 L 32 42 L 32 54 L 24 60 L 32 66 L 32 78 L 46 88" 
        stroke="url(#sdlc-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Circuit Nodes on Left Bracket -->
  <circle cx="46" cy="32" r="3" fill="#38bdf8"/>
  <circle cx="24" cy="60" r="3.5" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="46" cy="88" r="3" fill="#38bdf8"/>

  <!-- Right: Probabilistic AiDLC Neural Brain / Synapse Arc -->
  <!-- Closing Bracket with Synaptic Nodes -->
  <path d="M 74 32 L 88 42 L 88 54 L 96 60 L 88 66 L 88 78 L 74 88" 
        stroke="url(#aidlc-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Synapse Nodes on Right Bracket -->
  <circle cx="74" cy="32" r="3" fill="#f472b6"/>
  <circle cx="96" cy="60" r="3.5" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="74" cy="88" r="3" fill="#c084fc"/>

  <!-- Connecting Synapse Lines bridging Left & Right -->
  <line x1="44" y1="46" x2="60" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <line x1="76" y1="46" x2="60" y2="60" stroke="#ec4899" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <line x1="44" y1="74" x2="60" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <line x1="76" y1="74" x2="60" y2="60" stroke="#ec4899" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Central Compound AI Nucleus (The deterministic-probabilistic synthesis) -->
  <circle cx="60" cy="60" r="14" fill="url(#core-glow)" filter="url(#glow)"/>
  
  <!-- Four-Point Intelligence Star Spark -->
  <path d="M 60 48 Q 60 60 48 60 Q 60 60 60 72 Q 60 60 72 60 Q 60 60 60 48 Z" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="2.5" fill="#10b981"/>
</svg>
